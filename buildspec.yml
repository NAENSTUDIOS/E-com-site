version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
            - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o terraform.zip
            - unzip terraform.zip && mv terraform /usr/local/bin/ && rm terraform.zip
            - terraform version
            - pip3 install checkov
            - checkov --version
            - curl -fsSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
            - chmod +x /usr/local/bin/hadolint
            - hadolint --version
            - curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            - trivy --version
  pre_build:
    commands:
            - echo "Running terraform fmt check..."
            - terraform fmt -check -recursive
            - echo "Running terraform init..."
            - cd terraform && terraform init -backend=false && terraform validate && cd ..
            - echo "Running Checkov scan..."
            - checkov -d . --quiet
            - echo "Running Hadolint scan..."
            - hadolint Dockerfile
            - echo "Running npm ci..."
            - npm ci
            - echo "Checking server.js syntax..."
            - node --check server.js
            - echo "Running npm audit..."
            - npm audit --audit-level=high
            - echo "Logging in to Amazon ECR..."
            - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  build:
    commands:
            - echo "Building Docker image..."
            - docker build -t $ECR_REPO:latest .
            - echo "Running Trivy image scan..."
            - trivy image --exit-code 1 --severity HIGH,CRITICAL $ECR_REPO:latest
            - echo "Pushing image to ECR..."
            - docker tag $ECR_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
            - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
  post_build:
    commands:
            - echo "Writing imagedefinitions.json..."
            - printf '[{"name":"app","imageUri":"%s"}]' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest" > imagedefinitions.json
            - cat imagedefinitions.json

artifacts:
  files:
        - imagedefinitions.json
        - appspec.yaml
        - taskdef.json