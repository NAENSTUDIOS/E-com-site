version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    ECR_REPO: nasir-ecr

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o terraform.zip
      - mkdir -p /tmp/tf-install && unzip -o terraform.zip -d /tmp/tf-install
      - chmod +x /tmp/tf-install/terraform && mv -f /tmp/tf-install/terraform /usr/local/bin/terraform
      - rm -f terraform.zip && rm -rf /tmp/tf-install
      - terraform version
      - pip3 install checkov
      - checkov --version
      - curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
      - chmod +x /usr/local/bin/hadolint
      - hadolint --version
      - curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
      - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy && rm -f /tmp/trivy.tar.gz
      - trivy --version

  pre_build:
    commands:
      - ACC=$(aws sts get-caller-identity --query Account --output text)
      - REG=$ACC.dkr.ecr.$AWS_REGION.amazonaws.com
      - TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REG
      - (cd terraform && terraform fmt -check && terraform init -backend=false && terraform validate)
      - checkov -d terraform --quiet --soft-fail
      - hadolint --failure-threshold error Dockerfile
      - npm ci
      - node --check server.js
      - npm audit --audit-level=high

  build:
    commands:
      - docker build -t $REG/$ECR_REPO:$TAG .
      -      - trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db --exit-code 1 --severity CRITICAL --ignore-unfixed --pkg-types os,library --skip-files "usr/local/bin/*" $REG/$ECR_REPO:$TAG

  post_build:
    commands:
      - docker push $REG/$ECR_REPO:$TAG
      - printf '{"ImageURI":"%s"}' $REG/$ECR_REPO:$TAG > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
